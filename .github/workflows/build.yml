name: Tao APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Giai nen ma nguon
        run: |
          F=$(ls *.zip | head -1)
          echo "Dang giai nen: $F"
          unzip -q -o "$F" -d nguon
          D=$(find nguon -maxdepth 3 -name settings.gradle -printf '%h\n' | head -1)
          echo "Thu muc du an: $D"
          echo "DUAN=$D" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Cai platform Android
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Build APK
        run: |
          cd "$DUAN"
          chmod +x gradlew
          ./gradlew assembleTructiepRelease --no-daemon --stacktrace

      - name: Gom file APK
        run: |
          mkdir -p out
          cp "$DUAN"/app/build/outputs/apk/tructiep/release/*.apk out/LichViaPhat.apk
          ls -la out

      - name: Tao ban phat hanh de tai ve
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Lich Via Phat - ban ${{ github.run_number }}
          body: "Tinh That A Di Da - Chau Doc. Bam vao LichViaPhat.apk ben duoi de tai va cai."
          files: out/LichViaPhat.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: LichViaPhat-APK
          path: out/LichViaPhat.apk
